version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    ignore:
      # Eclipse JDT libraries are locked to specific versions for Java 8 compatibility
      - dependency-name: "org.eclipse.platform:*"
      - dependency-name: "org.eclipse.jdt:*"
      # jopt-simple is locked for Minecraft compatibility
      - dependency-name: "net.sf.jopt-simple:jopt-simple"